add_newline = true

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"

[directory]
truncation_length = 3
fish_style_pwd_dir_length = 2

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
conflicted = "⚡"
ahead = "⇡${count}"
behind = "⇣${count}"

[nix_shell]
symbol = " "
format = "via [$symbol$state]($style) "

[nodejs]
symbol = " "
[python]
symbol = " "
[rust]
symbol = " "
[golang]
symbol = " "
