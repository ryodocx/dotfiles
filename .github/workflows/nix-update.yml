name: "Nix Flake Update"

on:
  schedule:
    # Runs weekly on Monday at 00:00 UTC (09:00 JST)
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Update flake.lock
        run: |
          nix flake update

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update flake.lock"
          committer: GitHub <noreply@github.com>
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          signoff: false
          branch: nix-flake-update
          delete-branch: true
          title: "chore(deps): weekly nix flake update"
          body: |
            Weekly automated Nix Flake lockfile update.
            This PR updates `flake.lock` to the latest package definitions from the upstream registries.
          labels: |
            dependencies
            nix
